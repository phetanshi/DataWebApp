pipeline:
  name: Repository Build
  identifier: repository_build
  projectIdentifier: <+input>
  orgIdentifier: default
  properties:
    ci:
      codebase:
        connectorRef: account.repository_source
        repoName: phetanshi/DataWebApp
        build:
          type: branch
          spec:
            branch: main
  stages:
  - stage:
      name: DataWebApp/DataWebApp.Api (1)
      identifier: project_1
      type: CI
      spec:
        cloneCodebase: true
        execution:
          steps:
          - step:
              type: Run
              name: Restore
              identifier: restore_1
              spec:
                connectorRef: account.dockerhub
                image: mcr.microsoft.com/dotnet/sdk:7.0
                shell: Sh
                command: cd DataWebApp/DataWebApp.Api && dotnet restore DataWebApp.Api.csproj
          - step:
              type: Run
              name: Build
              identifier: build_2
              spec:
                connectorRef: account.dockerhub
                image: mcr.microsoft.com/dotnet/sdk:7.0
                shell: Sh
                command: cd DataWebApp/DataWebApp.Api && dotnet build DataWebApp.Api.csproj
                  --configuration Release --no-restore
          - step:
              type: Run
              name: Publish
              identifier: publish_3
              spec:
                connectorRef: account.dockerhub
                image: mcr.microsoft.com/dotnet/sdk:7.0
                shell: Sh
                command: cd DataWebApp/DataWebApp.Api && dotnet publish DataWebApp.Api.csproj
                  --configuration Release --no-build
        infrastructure:
          type: KubernetesDirect
          spec:
            connectorRef: account.repo_pipeline_k8s
            namespace: harness-ci
            delegateSelectors:
            - pipeline-generator-linux
            automountServiceAccountToken: true
            os: Linux
  - stage:
      name: DataWebApp/DataWebApp.Api/ClientApp (2)
      identifier: project_2
      type: CI
      spec:
        cloneCodebase: true
        execution:
          steps:
          - step:
              type: Run
              name: Restore
              identifier: restore_1
              spec:
                connectorRef: account.dockerhub
                image: node:lts
                shell: Sh
                command: cd DataWebApp/DataWebApp.Api/ClientApp && npm ci
          - step:
              type: Run
              name: Build
              identifier: build_2
              spec:
                connectorRef: account.dockerhub
                image: node:lts
                shell: Sh
                command: cd DataWebApp/DataWebApp.Api/ClientApp && npm run build
          - step:
              type: Run
              name: Test
              identifier: test_3
              spec:
                connectorRef: account.dockerhub
                image: node:lts
                shell: Sh
                command: cd DataWebApp/DataWebApp.Api/ClientApp && npm run test
        infrastructure:
          type: KubernetesDirect
          spec:
            connectorRef: account.repo_pipeline_k8s
            namespace: harness-ci
            delegateSelectors:
            - pipeline-generator-linux
            automountServiceAccountToken: true
            os: Linux
